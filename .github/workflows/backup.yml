name: Backup database

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump the database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "SUPABASE_DB_URL is empty"
            exit 1
          fi
          mkdir -p backups
          STAMP=$(date +%Y-%m-%d)
          supabase db dump --db-url "$DB_URL" -f "backups/eventscore-$STAMP.sql"
          gzip -f "backups/eventscore-$STAMP.sql"
          ls -lh backups/

      - name: Keep the last 30 days
        run: |
          cd backups
          ls -1t *.sql.gz 2>/dev/null | tail -n +31 | xargs -r rm --
          ls -1 *.sql.gz | wc -l

      - name: Commit it
        run: |
          git config user.name "EventScore backup"
          git config user.email "actions@github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Database backup $(date +%Y-%m-%d)"
            git push
          fi
